[project]
name = "keepass-wrapper"
version = "0.1.0"
description = "A secure KeePass wrapper with encryption and TOTP support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["keepass", "password", "totp", "encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pykeepass>=4.0",
    "cryptography>=41.0",
    "pyotp>=2.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "uv>=0.5.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/AlexAndrewsAI/pykeepass-wrapper"
Repository = "https://github.com/AlexAndrewsAI/pykeepass-wrapper.git"
Documentation = "https://github.com/AlexAndrewsAI/pykeepass-wrapper#readme"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "uv>=0.5.0",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = "pykeepass"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
